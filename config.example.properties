# Salin menjadi config.properties. Semua opsi juga bisa diatur lewat environment.
# Default: database lokal persisten, tanpa server.
db.url=jdbc:h2:./data/retroquest;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.user=sa
db.password=
# MySQL: buat database kosong dahulu: CREATE DATABASE retroquest CHARACTER SET utf8mb4;
# db.url=jdbc:mysql://localhost:3306/retroquest?serverTimezone=Asia/Jakarta
# db.user=retroquest
# db.password=isi_password
# Contoh endpoint layanan yang kompatibel Chat Completions; isi sesuai penyedia.
ai.endpoint=
ai.model=
ai.key=
# Path executable Tesseract dan bahasa terpasang, misalnya eng atau ind+eng.
ocr.command=tesseract
ocr.language=eng
data.directory=./data
